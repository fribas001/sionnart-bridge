schema_version = "1.0.0"

id = "sionnart_bridge"
version = "2.1.0"
name = "SionnaRT-Bridge"
tagline = "Run Sionna RT simulations and visualize results in Blender"
maintainer = "Felipe Oliveira Ribas <felipe.oliveiraribas@ugent.be>"
type = "add-on"
website = "https://github.com/fribas001/sionnart-bridge"
tags = ["3D View", "Import-Export", "Geometry Nodes"]
blender_version_min = "5.2.0"
license = ["SPDX:GPL-3.0-or-later"]
copyright = ["2026 Felipe Oliveira Ribas and contributors"]

[permissions]
files = "Export scenes and store simulation results"

